apiVersion: v1
kind: ConfigMap
metadata:
  name: event-registration-config
data:
  PORT: "3000"
  DB_PATH: /data/events.sqlite
  COOKIE_SECURE: "false"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: event-registration-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-registration
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: event-registration
  template:
    metadata:
      labels:
        app: event-registration
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: event-registration:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: event-registration-config
          volumeMounts:
            - name: event-data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 4
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 12
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: event-data
          persistentVolumeClaim:
            claimName: event-registration-data
---
apiVersion: v1
kind: Service
metadata:
  name: event-registration
spec:
  type: ClusterIP
  selector:
    app: event-registration
  ports:
    - name: http
      port: 80
      targetPort: http
